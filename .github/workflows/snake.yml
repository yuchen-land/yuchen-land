name: Generate snake

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 08:00（台北時間）更新一次
  workflow_dispatch:      # 允許在 Actions 分頁手動執行
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#F43F5E
            dist/snake-dark.svg?palette=github-dark&color_snake=#FB7185

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
